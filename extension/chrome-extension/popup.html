<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>DVIDM</title>
</head>
<body>
  <header>
    <img class="logo" src="icons/icon48.png" alt="DVIDM">
    <div class="brand">
      <div class="title">DVIDM</div>
      <div class="sub">DV Internet Download Manager</div>
    </div>
    <span id="status" class="pill">Checking…</span>
  </header>

  <div class="actions">
    <button id="send">Send selected links on page</button>
    <button id="copy" class="secondary">Copy selected links</button>
  </div>
  <label class="toggle">
    <input type="checkbox" id="selection-menu">
    <span>Show quick menu when text is selected</span>
  </label>
  <script src="popup.js"></script>
</body>
</html>
