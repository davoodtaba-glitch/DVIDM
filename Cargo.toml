[package]
name = "dvidm"
version = "0.5.71"
edition = "2021"
description = "DV Internet Download Manager"

# The GPUI Kit interface is the only front end. The feature name is kept so
# `cargo build --features gpui-ui --bin DVIDM-GPUI` still works.
[[bin]]
name = "DVIDM-GPUI"
path = "src/gpui-ui/main.rs"
required-features = ["gpui-ui"]

[features]
default = []
gpui-ui = ["dep:gpui-kit", "dep:smol", "dep:unicode-segmentation"]

[build-dependencies]
winres = "0.1"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "2.12", features = ["tls", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
dirs = "6"
open = "5"
uuid = { version = "1", features = ["v4"] }
tray-icon = "0.19"
raw-window-handle = "0.6"
gpui-kit = { version = "0.8", optional = true }
smol = { version = "2", optional = true }
unicode-segmentation = { version = "1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 16
strip = true

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
